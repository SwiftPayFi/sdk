name: sdk/checkout · ci

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'checkout/**'
      - '.github/workflows/checkout-ci.yml'
  push:
    branches-ignore: [main, dev]
    paths:
      - 'checkout/**'
      - '.github/workflows/checkout-ci.yml'

# Only one workflow per branch (push or PR, whichever is latest)
concurrency:
  group: sdk-checkout-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: checkout/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Pack (verify publish payload)
        run: npm pack --dry-run

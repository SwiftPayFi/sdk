name: sdk/nodejs · ci

on:
  pull_request:
    paths:
      - 'nodejs/**'
      - '.github/workflows/nodejs-ci.yml'
  push:
    branches: [main]
    paths:
      - 'nodejs/**'
      - '.github/workflows/nodejs-ci.yml'

# Cancel older runs on the same ref so the latest push wins.
concurrency:
  group: sdk-nodejs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nodejs/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Pack (verify publish payload)
        run: npm pack --dry-run

name: sdk/nodejs · release

on:
  push:
    branches: [main, dev]
    paths:
      - 'nodejs/**'
      - '.github/workflows/nodejs-release.yml'

concurrency:
  group: sdk-nodejs-release
  cancel-in-progress: false

# Permissions needed by changesets/action and npm provenance attestation.
permissions:
  contents: write       # commit version bumps + tags
  pull-requests: write  # open / update the "Version Packages" PR
  id-token: write       # npm provenance via OIDC

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so changesets can compute the right diff.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        working-directory: nodejs
        run: npm ci

      - name: Build (artifact for publish)
        working-directory: nodejs
        run: npm run build

      # Determine release tag (beta on dev, latest on main)
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "TAG=beta"
          else
            echo "TAG=latest"
          fi >> $GITHUB_OUTPUT

      # Either opens / updates a "Version Packages" PR (when there are pending
      # changesets and we're not on a version-bump commit), or runs `release`
      # to publish (when the bump PR has been merged).
      - name: Create version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          cwd: nodejs
          version: npm run version
          publish: npm publish --tag ${{ steps.tag.outputs.TAG }}
          commit: 'chore(sdk/nodejs): release'
          title: 'chore(sdk/nodejs): release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

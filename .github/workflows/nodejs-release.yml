name: sdk/nodejs · release

on:
  push:
    branches: [main, dev]
    paths:
      - 'nodejs/**'
      - '.github/workflows/nodejs-release.yml'

concurrency:
  group: sdk-nodejs-release
  cancel-in-progress: false

# Permissions needed by changesets/action and npm provenance attestation.
permissions:
  contents: write       # commit version bumps + tags
  pull-requests: write  # open / update the "Version Packages" PR
  id-token: write       # npm provenance via OIDC

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so changesets can compute the right diff.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        working-directory: nodejs
        run: npm ci

      - name: Build (artifact for publish)
        working-directory: nodejs
        run: npm run build

      # Determine release tag (beta on dev, latest on main)
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "TAG=beta"
          else
            echo "TAG=latest"
          fi >> $GITHUB_OUTPUT

      # Enter beta pre-release mode on dev, exit on main
      - name: Configure pre-release mode
        working-directory: nodejs
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            npx changeset pre enter beta 2>/dev/null || true
          else
            npx changeset pre exit 2>/dev/null || true
          fi

      # Version packages using changesets CLI
      - name: Version packages
        id: changesets
        working-directory: nodejs
        run: |
          npx changeset version
          # Check if there were changes to commit
          if git diff --quiet; then
            echo "hasChangesets=true" >> $GITHUB_OUTPUT
          else
            echo "hasChangesets=false" >> $GITHUB_OUTPUT
            git add -A
            git commit -m "chore(sdk/nodejs): release"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push version commit
      - name: Push version commit
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: git push

      # Publish to npm using changesets CLI
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        working-directory: nodejs
        run: npx changeset publish --tag ${{ steps.tag.outputs.TAG }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

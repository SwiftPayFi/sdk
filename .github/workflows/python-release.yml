name: sdk/python · release

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python-release.yml'
      - '.release-please-manifest.json'
      - '.release-please-config.json'

concurrency:
  group: sdk-python-release
  cancel-in-progress: false

# release-please needs to commit the version-bump PR; PyPI Trusted Publishers
# need OIDC.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: open release PR or tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Config + manifest live alongside the workflow at the sdk root.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    environment:
      name: pypi
      url: https://pypi.org/p/swiftpay-api-client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install build deps
        run: uv pip install --system build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publishers, OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

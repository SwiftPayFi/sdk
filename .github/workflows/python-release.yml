name: sdk/python · release

on:
  push:
    branches: [main, dev]
    paths:
      - 'python/**'
      - '.github/workflows/python-release.yml'
      - '.release-please-manifest.json'
      - '.release-please-config.json'

concurrency:
  group: sdk-python-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: open release PR or tag (main branch)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-latest:
    name: publish latest to PyPI (main)
    needs: release-please
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          password: ${{ secrets.PYPI_PUBLISH_TOKEN }}

  publish-beta:
    name: publish beta to PyPI (dev)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Bump version to beta
        run: |
          import re
          from pathlib import Path

          # Read current version from pyproject.toml
          pyproject = Path("pyproject.toml").read_text()
          match = re.search(r'version = "([^"]+)"', pyproject)
          current_version = match.group(1)

          # Parse version: 0.1.0 -> bump to 0.1.1-beta.0
          parts = current_version.split('.')
          if '-beta' in current_version:
            # Already beta: 0.1.1-beta.0 -> 0.1.1-beta.1
            base, beta = current_version.rsplit('-', 1)
            beta_num = int(beta.split('.')[-1]) + 1
            new_version = f"{base}-beta.{beta_num}"
          else:
            # Release: 0.1.0 -> 0.1.1-beta.0
            parts[-1] = str(int(parts[-1]) + 1)
            new_version = '.'.join(parts) + '-beta.0'

          print(f"Bumping {current_version} -> {new_version}")

          # Update pyproject.toml
          pyproject = pyproject.replace(f'version = "{current_version}"', f'version = "{new_version}"')
          Path("pyproject.toml").write_text(pyproject)

          # Update src/swiftpay/__init__.py
          init_file = Path("src/swiftpay/__init__.py")
          init_content = init_file.read_text()
          init_content = init_content.replace(f'__version__ = "{current_version}"', f'__version__ = "{new_version}"')
          init_file.write_text(init_content)
        shell: python

      - name: Build sdist + wheel
        run: uv build

      - name: Publish beta to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          password: ${{ secrets.PYPI_PUBLISH_TOKEN }}

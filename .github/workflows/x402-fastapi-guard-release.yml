name: sdk/x402-fastapi-guard · release

on:
  push:
    branches: [main]
    paths:
      - 'x402-fastapi-guard/**'
      - '.github/workflows/x402-fastapi-guard-release.yml'
      - '.release-please-manifest.json'
      - '.release-please-config.json'

concurrency:
  group: sdk-x402-fastapi-guard-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: open release PR or tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['x402-fastapi-guard--release_created'] }}
      tag_name: ${{ steps.release.outputs['x402-fastapi-guard--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x402-fastapi-guard
    environment:
      name: pypi
      url: https://pypi.org/p/swiftpay-x402-fastapi-guard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install build deps
        run: uv pip install --system build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publishers, OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: x402-fastapi-guard/dist/

name: sdk/x402-node-guard · ci

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'x402-node-guard/**'
      - '.github/workflows/x402-node-guard-ci.yml'
  push:
    branches-ignore: [main, dev]
    paths:
      - 'x402-node-guard/**'
      - '.github/workflows/x402-node-guard-ci.yml'

concurrency:
  group: sdk-x402-node-guard-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x402-node-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: x402-node-guard/package-lock.json

      - name: Build api-client (peer dependency)
        working-directory: nodejs
        run: npm ci && npm run build

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Pack (verify publishable)
        run: npm pack --dry-run

name: sdk/x402-node-guard · release

on:
  push:
    branches: [main, dev]
    paths:
      - 'x402-node-guard/**'
      - '.github/workflows/x402-node-guard-release.yml'

concurrency:
  group: sdk-x402-node-guard-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: x402-node-guard/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Build api-client (peer dependency)
        working-directory: nodejs
        run: npm ci && npm run build

      - name: Install
        working-directory: x402-node-guard
        run: npm ci

      - name: Build
        working-directory: x402-node-guard
        run: npm run build

      # Determine release tag (beta on dev, latest on main)
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "TAG=beta"
          else
            echo "TAG=latest"
          fi >> $GITHUB_OUTPUT

      # Enter beta pre-release mode on dev, exit on main
      - name: Configure pre-release mode
        working-directory: x402-node-guard
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            npx changeset pre enter beta 2>/dev/null || true
          else
            npx changeset pre exit 2>/dev/null || true
          fi

      - name: Create version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          cwd: x402-node-guard
          version: npm run version
          publish: npm publish --tag ${{ steps.tag.outputs.TAG }}
          commit: 'chore(sdk/x402-node-guard): release'
          title: 'chore(sdk/x402-node-guard): release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
